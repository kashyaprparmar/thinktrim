[project]
name = "thinktrim-laya-sidecar"
version = "0.1.0"
description = "Persistent local Laya inference sidecar for ThinkTrim"
requires-python = ">=3.11,<4"
dependencies = []

[project.optional-dependencies]
model = ["laya>=0.3.20,<0.4"]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
thinktrim-laya-sidecar = "thinktrim_laya_sidecar.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thinktrim_laya_sidecar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
